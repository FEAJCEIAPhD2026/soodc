<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Observação - Módulo 4 Central</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="banner">Sistema de Observação do Objeto de Design de Comunicação</div>
    <div id="main-container">
        <!-- BARRA LATERAL ATUALIZADA -->
        <div id="sidebar"></div>

        <!-- ÁREA CENTRAL MAIN -->
        <div id="content-area">
            <div class="module-title">Módulo 4 – Classificação do Objeto de Design de Comunicação Gráfico</div>
            
            <!-- CORRIGIDO: Atribuído o ID correto para a herança automática da consola Código -->
            <div class="form-group">
                <label>Código</label>
                <input type="text" id="m4-codigo-herdado" disabled placeholder="[Herdado do Módulo 1]">
            </div>
            
            <div class="form-group">
                <label style="font-weight:bold;">Categoria</label>
                <div class="bifurcation-container">
                    <button class="bifurcation-btn active" onclick="location.href='grafico_m4.html'">Objeto Gráfico</button>
                    <button class="bifurcation-btn" onclick="location.href='discursivo_m4.html'">Objeto Discursivo</button>
                </div>
            </div>

            <div class="form-group" style="margin-top:20px;">
                <label>Indicador Principal</label>
                <select id="m4-ind-principal">
                    <option value="">-- Selecione --</option>
                    <option value="Publicações e Design Editorial">Publicações e Design Editorial</option>
                    <option value="Comunicação de Efêmeros e Grande Formato">Comunicação de Efêmeros e Grande Formato</option>
                    <option value="Identidade Corporativa e Imagem Institucional">Identidade Corporativa e Imagem Institucional</option>
                    <option value="Design de Embalagem e Produto Gráfico">Design de Embalagem e Produto Gráfico</option>
                    <option value="Gráfica Comercial, Fiscal e de Valores">Gráfica Comercial, Fiscal e de Valores</option>
                    <option value="Suportes de Comunicação Digital e Ecrã">Suportes de Comunicação Digital e Ecrã</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Indicador Secundário</label>
                <select id="m4-ind-secundario">
                    <option value="">-- Selecione --</option>
                    <option value="Cartaz">Cartaz</option>
                    <option value="Desdobrável">Desdobrável</option>
                    <option value="Capa de livro">Capa de livro</option>
                    <option value="Paginação interior">Paginação interior</option>
                    <option value="Folheto">Folheto</option>
                    <option value="Logótipo">Logótipo</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 25px;">
                <label>Variáveis e Sub-Variáveis</label>
                <button class="nav-btn" style="margin-top: 5px; width: 220px;" onclick="location.href='composicao_m4.html'">1. Composição</button>
                <button class="nav-btn" style="width: 220px;" onclick="location.href='tipografia_m4.html'">2. Tipografia</button>
                <button class="nav-btn" style="width: 220px;" onclick="location.href='iconografia_m4.html'">3. Iconografia</button>
                <button class="nav-btn" style="width: 220px;" onclick="location.href='cromatica_m4.html'">4. Cromática</button>
            </div>

            <!-- CORRIGIDO: Atribuído ID específico para intercomunicabilidade com o Módulo 2 -->
            <div class="form-group" style="margin-top: 40px;">
                <label>Valores Observados</label>
                <input type="text" id="m4-valores-observados-grafico" placeholder="Insira os campos e valores específicos detetados...">
            </div>
            
            <div class="form-group">
                <label>Observações</label>
                <textarea id="m4-obs-grafico" placeholder="Notas, reflexões livres e observações do investigador sobre a classificação deste objeto..."></textarea>
            </div>

            <!-- CORRIGIDO: IDs e função de envio legítimo mapeados -->
            <div class="footer-buttons" style="margin-top:40px; border-top: none; padding-top: 0;">
                <button id="btn-gravar-m4-grafico" onclick="executarGravacaoM4Central()">Gravar</button>
                <button id="btn-editar-m4-grafico" disabled>Editar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

    <!-- LOGICA LOCAL DE COMPILAÇÃO EXCLUSIVA DESTA PÁGINA PIVOT -->
    <script>
        function ejecutarGravacaoM4Central() {
            const indP = document.getElementById('m4-ind-principal').value;
            const indS = document.getElementById('m4-ind-secundario').value;
            const valores = document.getElementById('m4-valores-observados-grafico').value;

            if(!indP && !valores) {
                alert("Por favor, preencha pelo menos um indicador ou os valores observados.");
                return;
            }

            // Monta o resumo estruturado desta página central
            let resumoUnificado = [];
            if(indP) resumoUnificado.push(`[${indP} - ${indS || 'Geral'}]`);
            if(valores) resumoUnificado.push(valores);

            // Grava através da função nativa do script.js
            if(typeof gravarVariavelM4Grafico === "function") {
                gravarVariavelM4Grafico('classificacao_central', resumoUnificado.join(' -> '));
            } else {
                alert("Erro: O motor script.js não foi carregado corretamente.");
            }
        }
    </script>
</body>
</html>
