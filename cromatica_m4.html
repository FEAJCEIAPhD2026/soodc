<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Observação - Módulo 4 Cromática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="banner">Sistema de Observação do Objeto de Design de Comunicação</div>
    <div id="main-container">
        <!-- BARRA LATERAL -->
        <div id="sidebar"></div>

        <!-- ÁREA CENTRAL -->
        <div id="content-area">
            <div class="module-title">Módulo 4 – Classificação (Objeto de Design de Comunicação Gráfico - Cromática)</div>
            
            <!-- CORRIGIDO: Atribuído o ID correto para herança automática da consola Código -->
            <div class="form-group">
                <label>Código</label>
                <input type="text" id="m4-codigo-herdado" disabled placeholder="[Herdado do Módulo 1]">
            </div>
            
            <div class="form-group">
                <label style="font-weight:bold;">Categoria</label>
                <div class="bifurcation-container">
                    <button class="bifurcation-btn active" onclick="location.href='grafico_m4.html'">Objeto Gráfico</button>
                    <button class="bifurcation-btn" disabled style="opacity:0.5;">Objeto Discursivo</button>
                </div>
            </div>

            <!-- SUB-NAVEGAÇÃO VERTICAL -->
            <div class="form-group" style="margin-top: 25px;">
                <label>Variáveis e Sub-Variáveis</label>
                <button class="nav-btn" style="margin-top: 5px; width: 220px;" onclick="location.href='composicao_m4.html'">1. Composição</button>
                <button class="nav-btn" style="width: 220px;" onclick="location.href='tipografia_m4.html'">2. Tipografia</button>
                <button class="nav-btn" style="width: 220px;" onclick="location.href='iconografia_m4.html'">3. Iconografia</button>
                <button class="nav-btn active" style="width: 220px;" onclick="location.href='cromatica_m4.html'">4. Cromática</button>
                <button class="nav-btn" style="width: 220px; background-color: #f0f0f0; font-weight: bold;" onclick="location.href='grafico_m4.html'">Voltar à Consola Principal</button>
            </div>

            <div class="form-group" style="margin-top: 40px; margin-bottom: 20px;">
                <label>Sub-Variáveis</label>
            </div>

            <div class="form-group">
                <label>1. Regime Cromático / Quantidade de Cores (Escolha Múltipla)</label>
                <div class="checkbox-group" data-grupo="Regime Cromático">
                    <label class="checkbox-item"><input type="checkbox" value="Acromático"> Acromático</label>
                    <label class="checkbox-item"><input type="checkbox" value="Monocromático"> Monocromático</label>
                    <label class="checkbox-item"><input type="checkbox" value="Bicromia / Duotone"> Bicromia / Duotone</label>
                    <label class="checkbox-item"><input type="checkbox" value="Policromia Limitada / Paleta Restrita"> Policromia Limitada / Paleta Restrita</label>
                    <label class="checkbox-item"><input type="checkbox" value="Policromia Alargada / Cor Total"> Policromia Alargada / Cor Total</label>
                </div>
            </div>
            
            <div class="form-group">
                <label>2. Harmonia e Relação entre Matizes (Escolha Múltipla)</label>
                <div class="checkbox-group" data-grupo="Harmonia">
                    <label class="checkbox-item"><input type="checkbox" value="Harmonia Monocromática"> Harmonia Monocromática</label>
                    <label class="checkbox-item"><input type="checkbox" value="Harmonia Análoga"> Harmonia Análoga</label>
                    <label class="checkbox-item"><input type="checkbox" value="Harmonia Complementar"> Harmonia Complementar</label>
                    <label class="checkbox-item"><input type="checkbox" value="Harmonia de Tríade / Poligonal"> Harmonia de Tríade / Poligonal</label>
                    <label class="checkbox-item"><input type="checkbox" value="Acromática"> Acromática</label>
                </div>
            </div>
            
            <div class="form-group">
                <label>3. Saturação e Luminosidade Dominante (Escolha Múltipla)</label>
                <div class="checkbox-group" data-grupo="Saturação">
                    <label class="checkbox-item"><input type="checkbox" value="Vibrante / Alta Saturação"> Vibrante / Alta Saturação</label>
                    <label class="checkbox-item"><input type="checkbox" value="Pastel / Baixa Saturação"> Pastel / Baixa Saturação</label>
                    <label class="checkbox-item"><input type="checkbox" value="Esbatida / Terrosa / Quebrada"> Esbatida / Terrosa / Quebrada</label>
                    <label class="checkbox-item"><input type="checkbox" value="Contraste de Claro-Escuro"> Contraste de Claro-Escuro</label>
                </div>
            </div>
            
            <div class="form-group">
                <label>4. Função Operativa da Cor (Escolha Múltipla)</label>
                <div class="checkbox-group" data-grupo="Função Operativa">
                    <label class="checkbox-item"><input type="checkbox" value="Função Estruturante / Sintática"> Função Estruturante / Sintática</label>
                    <label class="checkbox-item"><input type="checkbox" value="Função Expressiva / Emocional"> Função Expressiva / Emocional</label>
                    <label class="checkbox-item"><input type="checkbox" value="Função Realista / Mimética"> Função Realista / Mimética</label>
                    <label class="checkbox-item"><input type="checkbox" value="Função Simbólica / Convencional"> Função Simbólica / Convencional</label>
                    <label class="checkbox-item"><input type="checkbox" value="Função Sinalética / Alerta"> Função Sinalética / Alerta</label>
                </div>
            </div>

            <!-- CORRIGIDO: IDs e função local de empacotamento ativa -->
            <div class="footer-buttons" style="margin-top:40px; border-top: none; padding-top: 0;">
                <button id="btn-gravar-m4-cromatica" onclick="recolherDadosCromatica()">Gravar</button>
                <button id="btn-editar-m4-cromatica" disabled>Editar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

    <script>
        function recolherDadosCromatica() {
            let selecoes = [];
            
            const grupos = document.querySelectorAll('.checkbox-group');
            grupos.forEach(grupo => {
                const nomeGrupo = grupo.getAttribute('data-grupo');
                let itensGrupo = [];
                
                const marcados = grupo.querySelectorAll('input[type="checkbox"]:checked');
                marcados.forEach(cb => {
                    itensGrupo.push(cb.value);
                });
                
                if(itensGrupo.length > 0) {
                    selecoes.push(`${nomeGrupo} (${itensGrupo.join(', ')})`);
                }
            });

            if(selecoes.length === 0) {
                alert("Por favor, selecione pelo menos uma variável cromática antes de gravar.");
                return;
            }

            if(typeof gravarVariavelM4Grafico === "function") {
                gravarVariavelM4Grafico('cromática', selecoes.join(' | '));
            } else {
                alert("Erro: O motor de dados script.js não foi encontrado.");
            }
        }
    </script>
</body>
</html>
