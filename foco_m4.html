<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Observação - Módulo 4 Foco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="banner">Sistema de Observação do Objeto de Design de Comunicação</div>
    <div id="main-container">
        <!-- BARRA LATERAL -->
        <div id="sidebar"></div>

        <!-- ÁREA CENTRAL (FOCO CONSOLIDADA) -->
        <div id="content-area">
            <div class="module-title">Módulo 4 – Classificação (Objeto Discursivo - Foco Disciplinar e Esfera Temática)</div>
            
            <!-- CORRIGIDO: Atribuído o ID correto para herança automática da consola Código -->
            <div class="form-group">
                <label>Código</label>
                <input type="text" id="m4-codigo-herdado" disabled placeholder="[Herdado do Módulo 1]">
            </div>
            
            <div class="form-group">
                <label style="font-weight:bold;">Categoria</label>
                <div class="bifurcation-container">
                    <button class="bifurcation-btn" onclick="location.href='grafico_m4.html'">Objeto Gráfico</button>
                    <button class="bifurcation-btn active" onclick="location.href='discursivo_m4.html'">Objeto Discursivo</button>
                </div>
            </div>

            <!-- SUB-NAVEGAÇÃO VERTICAL -->
            <div class="form-group" style="margin-top: 25px;">
                <label>Variáveis e Sub-Variáveis</label>
                <button class="nav-btn" style="margin-top: 5px; width: 260px;" onclick="location.href='estrutura_m4.html'">1. Estrutura Textual / Pensamento</button>
                <button class="nav-btn" style="width: 260px;" onclick="location.href='enunciacao_m4.html'">2. Enunciação e Estilo</button>
                <button class="nav-btn" style="width: 260px;" onclick="location.href='retorica_m4.html'">3. Retórica / Argumentação</button>
                <button class="nav-btn active" style="width: 260px;" onclick="location.href='foco_m4.html'">4. Foco / Esfera Temática</button>
                <button class="nav-btn" style="width: 260px; background-color: #f0f0f0; font-weight: bold;" onclick="location.href='discursivo_m4.html'">Voltar à Consola Principal</button>
            </div>

            <div class="form-group" style="margin-top: 40px; margin-bottom: 20px;"><label>Sub-Variáveis</label></div>

            <!-- CONSOLAS TAXONÓMICAS REPOSTAS COM MARCAÇÃO DE GRUPOS -->
            <div class="form-group">
                <label>Foco Disciplinar (Escolha Múltipla)</label>
                <div class="checkbox-group" data-grupo="Foco Disciplinar">
                    <label class="checkbox-item"><input type="checkbox" value="Teoria e Crítica do Design"> Teoria e Crítica do Design</label>
                    <label class="checkbox-item"><input type="checkbox" value="História do Design / Artes Gráficas"> História do Design / Artes Gráficas</label>
                    <label class="checkbox-item"><input type="checkbox" value="Prática Profissional / Pragmática"> Prática Profissional / Pragmática</label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Esfera Temática (Escolha Múltipla)</label>
                <div class="checkbox-group" data-grupo="Esfera Temática">
                    <label class="checkbox-item"><input type="checkbox" value="Política / Ideologia / Sociedade"> Política / Ideologia / Sociedade</label>
                    <label class="checkbox-item"><input type="checkbox" value="Pedagogia / Ensino Superior"> Pedagogia / Ensino Superior</label>
                    <label class="checkbox-item"><input type="checkbox" value="Estética / Cultura Visual Geral"> Estética / Cultura Visual Geral</label>
                </div>
            </div>

            <!-- RODAPÉ CORRIGIDO COM FUNÇÃO DE INTERCOMUNICABILIDADE -->
            <div class="footer-buttons" style="margin-top:40px; border-top: none; padding-top: 0;">
                <button id="btn-gravar-m4-foco" onclick="recolherDadosFoco()">Gravar</button>
                <button id="btn-editar-m4-foco" disabled>Editar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

    <script>
        function recolherDadosFoco() {
            let selecoes = [];
            
            const grupos = document.querySelectorAll('.checkbox-group');
            grupos.forEach(grupo => {
                const nomeGrupo = grupo.getAttribute('data-grupo');
                let itensGrupo = [];
                
                const marcados = grupo.querySelectorAll('input[type="checkbox"]:checked');
                marcados.forEach(cb => {
                    itensGrupo.push(cb.value);
                });
                
                if(itensGrupo.length > 0) {
                    selecoes.push(`${nomeGrupo} (${itensGrupo.join(', ')})`);
                }
            });

            if(selecoes.length === 0) {
                alert("Por favor, selecione pelo menos uma variável de foco antes de gravar.");
                return;
            }

            if(typeof gravarVariavelM4Discursivo === "function") {
                gravarVariavelM4Discursivo('foco_disciplinar_e_esfera_temática', selecoes.join(' | '));
            } else {
                alert("Erro: O motor de dados script.js não foi encontrado.");
            }
        }
    </script>
</body>
</html>
